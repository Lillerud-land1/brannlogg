name: Oppdater Brannlogg Stord

# Hentar nye brannar frå Politiloggen kvar morgon kl. 06:00 norsk tid og legg ut nettsida.
# GitHub brukar UTC, så jobben står på både 04:00 og 05:00 UTC og køyrer berre den
# som svarar til 06:00 i Noreg (sommartid / vintertid).
on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  push:
    branches: [main]
    paths: ["ekstra.json", "mal.html", "mal-tv.html", "oppdater.py", ".github/workflows/oppdater.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: brannlogg
  cancel-in-progress: false

jobs:
  klokke:
    runs-on: ubuntu-latest
    outputs:
      kjor: ${{ steps.sjekk.outputs.kjor }}
    steps:
      - id: sjekk
        env:
          PLAN: ${{ github.event.schedule }}
        run: |
          kjor=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            forskyving=$(TZ=Europe/Oslo date +%z)
            kjor=false
            if [ "$PLAN" = "0 4 * * *" ] && [ "$forskyving" = "+0200" ]; then kjor=true; fi
            if [ "$PLAN" = "0 5 * * *" ] && [ "$forskyving" = "+0100" ]; then kjor=true; fi
          fi
          echo "kjor=$kjor" >> "$GITHUB_OUTPUT"

  oppdater:
    needs: klokke
    if: needs.klokke.outputs.kjor == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publiser.outputs.page_url }}
    env:
      TZ: Europe/Oslo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Hent brannar og bygg nettsida
        run: python oppdater.py

      - name: Lagre nye data i repoet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Dagleg oppdatering $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: nettside

      - id: publiser
        uses: actions/deploy-pages@v5
