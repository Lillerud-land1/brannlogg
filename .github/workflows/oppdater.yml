name: Oppdater Brannlogg Stord

# Hentar nye data frå brannstatistikken og Politiloggen kvart kvarter, finn nyheitslenker og legg ut nettsida.
# GitHub sine planlagde køyringar (cron) er ikkje til å stole på – dei blir ofte forseinka eller hoppa over,
# særleg på heile kvarter. Difor startar kvar køyring sjølv den neste om om lag 15 minutt (jobben «neste»).
# Cron på skeive minutt er berre ein reserve som startar kjeda igjen om ho skulle stoppe.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths: ["ekstra.json", "mal.html", "mal-tv.html", "mal-tv.webmanifest", "oppdater.py", ".github/workflows/oppdater.yml"]
  workflow_dispatch:

# Tryggleik: ingen løyve som standard – kvar jobb får berre det han treng.
# Actions er låste til ein fast versjon (commit-SHA), så ein kapra versjonstagg ikkje kan endre bygginga.
permissions: {}

jobs:
  rydd:
    # Ei køyring som heng (GitHub har latt ei stå på «waiting» i dagevis) blokkerer alle andre, sidan berre
    # éin oppdater-jobb får gå om gongen. Denne jobben går utan kø og avbryt køyringar som er over 60 minutt
    # gamle og ikkje ferdige. Ei vanleg køyring tek om lag 15 minutt (inkludert ventinga i «neste»).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write    # avbryte køyringar som heng
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Avbryt køyringar som heng
        run: |
          grense=$(date -u -d '60 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
          heng=$(gh run list --workflow oppdater.yml --limit 50 --json databaseId,status,createdAt             -q ".[] | select(.status != \"completed\" and .databaseId != ${{ github.run_id }} and .createdAt < \"$grense\") | .databaseId")
          for id in $heng; do
            echo "Avbryt køyring $id – ho har ikkje vorte ferdig på over 60 minutt"
            gh api -X POST "repos/$GH_REPO/actions/runs/$id/force-cancel" || echo "Klarte ikkje å avbryte $id"
          done
          [ -n "$heng" ] || echo "Ingen køyringar heng"

  oppdater:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # lagre nye data i repoet
      pages: write      # leggje ut nettsida
      id-token: write   # krevst av deploy-pages
    concurrency:
      group: brannlogg
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publiser.outputs.page_url }}
    env:
      TZ: Europe/Oslo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Hent brannar, finn nyheitssaker og bygg nettsida
        run: python oppdater.py --nyheiter --varsle
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TV_ADRESSE: ${{ secrets.TV_ADRESSE }}   # hemmeleg adresse til infoskjermen

      - name: Lagre nye brannar i arkivet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arkiv.json geokode.json auto_kjelder.json varsla.json bris.json bris_utan_info.json
          if ! git diff --cached --quiet; then
            git commit -m "Nye data frå Politiloggen $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: nettside

      - id: publiser
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1

  neste:
    # Startar neste køyring sjølv. Berre éi kjede om gongen: går det alt ei anna køyring, blir det ikkje starta fleire.
    needs: oppdater
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write    # sjå køyringar og starte neste
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Vent 13 minutt og start neste køyring
        run: |
          sleep 780
          andre=$(gh run list --workflow oppdater.yml --limit 20 --json databaseId,status \
            -q '[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != "completed")] | length')
          if [ "$andre" = "0" ]; then
            gh workflow run oppdater.yml --ref main
            echo "Starta neste køyring"
          else
            echo "Det går alt $andre anna køyring(ar) – startar ikkje fleire"
          fi
