name: Oppdater Brannlogg Stord

# Hentar nye data frå brannstatistikken og Politiloggen kvart kvarter, finn nyheitslenker og legg ut nettsida.
# GitHub sine planlagde køyringar (cron) er ikkje til å stole på – dei blir ofte forseinka eller hoppa over,
# særleg på heile kvarter. Difor startar kvar køyring sjølv den neste om om lag 15 minutt (jobben «neste»).
# Cron på skeive minutt er berre ein reserve som startar kjeda igjen om ho skulle stoppe.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
    paths: ["ekstra.json", "mal.html", "mal-tv.html", "oppdater.py", ".github/workflows/oppdater.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  oppdater:
    runs-on: ubuntu-latest
    concurrency:
      group: brannlogg
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.publiser.outputs.page_url }}
    env:
      TZ: Europe/Oslo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Hent brannar, finn nyheitssaker og bygg nettsida
        run: python oppdater.py --nyheiter --varsle
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Lagre nye brannar i arkivet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arkiv.json geokode.json auto_kjelder.json varsla.json bris.json bris_utan_info.json
          if ! git diff --cached --quiet; then
            git commit -m "Nye data frå Politiloggen $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: nettside

      - id: publiser
        uses: actions/deploy-pages@v5

  neste:
    # Startar neste køyring sjølv. Berre éi kjede om gongen: går det alt ei anna køyring, blir det ikkje starta fleire.
    needs: oppdater
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Vent 13 minutt og start neste køyring
        run: |
          sleep 780
          andre=$(gh run list --workflow oppdater.yml --limit 20 --json databaseId,status \
            -q '[.[] | select(.databaseId != ${{ github.run_id }}) | select(.status != "completed")] | length')
          if [ "$andre" = "0" ]; then
            gh workflow run oppdater.yml --ref main
            echo "Starta neste køyring"
          else
            echo "Det går alt $andre anna køyring(ar) – startar ikkje fleire"
          fi
