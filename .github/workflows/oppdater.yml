name: Oppdater Brannlogg Stord

# Hentar nye brannar frå Politiloggen kvar heile time og legg ut nettsida.
# GitHub kan av og til starte planlagde jobbar nokre minutt for seint.
on:
  schedule:
    - cron: "0 * * * *"
  push:
    branches: [main]
    paths: ["ekstra.json", "mal.html", "mal-tv.html", "oppdater.py", ".github/workflows/oppdater.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: brannlogg
  cancel-in-progress: false

jobs:
  oppdater:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publiser.outputs.page_url }}
    env:
      TZ: Europe/Oslo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Hent brannar og bygg nettsida
        run: python oppdater.py

      - name: Lagre nye brannar i arkivet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arkiv.json geokode.json
          if ! git diff --cached --quiet; then
            git commit -m "Nye data frå Politiloggen $(date '+%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: nettside

      - id: publiser
        uses: actions/deploy-pages@v5
