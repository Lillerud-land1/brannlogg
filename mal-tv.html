<!doctype html>
<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brannlogg Stord – infoskjerm</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Infoskjerm: alltid mørk, skalerer etter skjermstorleiken (16:9), ingen rulling */
:root{
  color-scheme:dark;
  --bg:#0A0D11; --panel:#12171E; --panel-2:#181E26; --ink:#EEF1F4; --ink-2:#C2C9D1; --muted:#87919C;
  --line:#252D37; --fire:#FF5A3D; --ember:#FFA03A; --hivis:#F5CB2A;
  --sev1:#8FA4BB; --sev2:#FFA03A; --sev3:#FF5A3D;
  --sea:#0E1620; --ctx:#19202A; --land:#232B36; --land-edge:#3A4552; --label:#9AA4AF;
  --f-display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --f-body:"Schibsted Grotesk",system-ui,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,monospace;
  font-size:min(calc(100vh / 60), calc(100vw / 106));
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);cursor:none}
.skjerm{height:100vh;display:grid;grid-template-rows:auto 1fr auto;gap:1.2rem;padding:1.6rem 2rem 1.4rem}

/* Topp */
.topp{display:flex;align-items:center;gap:1.4rem}
.logo{width:3.6rem;height:3.6rem;flex:none}
.namn{font-family:var(--f-display);font-weight:800;font-size:3.2rem;letter-spacing:.03em;text-transform:uppercase;line-height:.9}
.namn small{display:block;font-family:var(--f-body);font-weight:600;font-size:1.05rem;letter-spacing:.14em;color:var(--muted);margin-top:.35rem}
.batt{flex:1;height:1rem;border-radius:.2rem;background:conic-gradient(var(--hivis) 25%,var(--fire) 0 50%,var(--hivis) 0 75%,var(--fire) 0) 0 0/2.4rem 1rem;opacity:.9}
.klokke{text-align:right;line-height:1}
.klokke b{font-family:var(--f-display);font-weight:800;font-size:4rem;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.klokke span{display:block;font-size:1.15rem;color:var(--ink-2);margin-top:.3rem}

/* Hovuddel */
.hovud{display:grid;grid-template-columns:30fr 40fr 30fr;gap:1.4rem;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:.8rem;padding:1.4rem 1.6rem;min-height:0;display:flex;flex-direction:column}
.etikett{font-size:1.05rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.etikett b{color:var(--ink)}

.teljar{position:relative;overflow:hidden;background-image:radial-gradient(120% 80% at 0% 100%,rgba(255,120,40,.16),transparent 60%),linear-gradient(var(--panel),var(--panel))}
.stort{font-family:var(--f-display);font-weight:800;font-size:15rem;line-height:.8;margin-top:1rem;font-variant-numeric:tabular-nums;
  background:linear-gradient(175deg,var(--hivis),var(--ember) 40%,var(--fire) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.stort-tekst{font-family:var(--f-display);font-weight:600;font-size:2.6rem;text-transform:uppercase;letter-spacing:.03em;margin-top:.4rem}
.siste{margin-top:1rem;font-size:1.3rem;color:var(--ink-2);line-height:1.35}
.siste b{color:var(--ink)}
.stripe-boks{margin-top:auto}
.stripe{display:grid;grid-template-columns:repeat(var(--kol,50),minmax(0,1fr));gap:.1rem;height:3.4rem;margin-top:.7rem}
.stripe i{border-radius:.12rem;background:#1F2630}
.stripe i.f1{background:var(--sev1)} .stripe i.f2{background:var(--sev2)} .stripe i.f3{background:var(--sev3)}
.stripe i.idag{box-shadow:inset 0 0 0 .2rem var(--ink)}
.akse{display:flex;justify-content:space-between;font-size:1rem;color:var(--muted);margin-top:.4rem}
.tal{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin-top:1.3rem}
.tal div{background:var(--panel-2);border-radius:.5rem;padding:.8rem 1rem}
.tal b{display:block;font-family:var(--f-display);font-weight:800;font-size:2.8rem;line-height:1;font-variant-numeric:tabular-nums}
.tal span{font-size:1rem;color:var(--muted)}

/* Aktiv brann */
.alarm{margin-top:1rem;padding:1.2rem;border-radius:.6rem;background:rgba(255,90,61,.14);border:.15rem solid var(--fire)}
.alarm h2{font-family:var(--f-display);font-size:4.4rem;line-height:.9;color:var(--fire);text-transform:uppercase}
.alarm p{font-size:1.5rem;margin-top:.5rem}

/* Liste */
.liste{list-style:none;padding:0;display:flex;flex-direction:column;gap:.8rem;margin-top:1rem;min-height:0;overflow:hidden}
.rad{display:grid;grid-template-columns:.5rem 3.6rem minmax(0,1fr) auto;gap:1rem;align-items:center;background:var(--panel-2);border-radius:.6rem;padding:.9rem 1.2rem .9rem 0;overflow:hidden}
.rad .strek{align-self:stretch;background:var(--sev)}
.s1{--sev:var(--sev1)} .s2{--sev:var(--sev2)} .s3{--sev:var(--sev3)}
.rad .ic{width:3.6rem;height:3.6rem;border-radius:.5rem;display:grid;place-items:center;color:var(--sev);background:color-mix(in srgb,var(--sev) 15%,transparent)}
.rad .ic svg{width:2.1rem;height:2.1rem}
.rad h3{font-size:1.65rem;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rad p{font-size:1.2rem;color:var(--ink-2);margin-top:.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rad p b{color:var(--ink);font-weight:600}
.rad .kor{text-align:right;font-family:var(--f-mono);font-size:1.15rem;color:var(--muted);line-height:1.35;white-space:nowrap}
.rad .kor b{display:block;font-family:var(--f-display);font-size:2rem;color:var(--ink);font-weight:800}
.rad.ny{outline:.15rem solid var(--ember)}
.pagar{display:inline-flex;align-items:center;gap:.5rem;color:var(--fire);font-weight:700;font-family:var(--f-body)}
.pagar i{width:.8rem;height:.8rem;border-radius:50%;background:var(--fire);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.tomt{font-size:1.4rem;color:var(--muted);margin-top:1rem}

/* Kart */
.kart{flex:1;min-height:0;margin-top:1rem;border-radius:.6rem;overflow:hidden;background:var(--sea);display:flex;align-items:center;justify-content:center}
.kart svg{height:100%;width:auto;max-width:100%;display:block}
.m-ctx{fill:var(--ctx)} .m-land{fill:var(--land);stroke:var(--land-edge);stroke-width:1.6}
.m-lbl{font:600 34px var(--f-body);fill:var(--label);letter-spacing:.06em;text-transform:uppercase}
.m-dot{fill:var(--label)}
.mk circle.c{stroke:#0A0D11;stroke-width:4}
.mk.gl circle.c{opacity:.5}
.mk .ring{fill:none;stroke-width:3;transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(2.2);opacity:0}}
.forklaring{display:flex;flex-wrap:wrap;gap:.4rem 1.1rem;margin-top:.8rem;font-size:1.05rem;color:var(--muted)}
.forklaring span{display:inline-flex;align-items:center;gap:.5rem}
.forklaring i{width:1rem;height:1rem;border-radius:50%;background:var(--sev)}

/* Botn */
.botn{display:grid;grid-template-columns:auto 1fr auto;gap:1.4rem;align-items:center}
.n110{display:flex;align-items:center;gap:1rem;background:var(--fire);color:#fff;border-radius:.6rem;padding:.6rem 1.3rem}
.n110 b{font-family:var(--f-display);font-weight:800;font-size:3.2rem;line-height:.9}
.n110 span{font-size:1.1rem;font-weight:600;line-height:1.25}
.tips{font-size:1.35rem;color:var(--ink-2);line-height:1.35}
.tips b{color:var(--ember);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:1.05rem;display:block;margin-bottom:.2rem}
.qr{display:flex;align-items:center;gap:1rem}
.qr img{width:6.2rem;height:6.2rem;background:#fff;border-radius:.4rem;padding:.3rem}
.qr span{font-size:1.1rem;color:var(--ink-2);line-height:1.3;max-width:13rem}
.qr small{display:block;color:var(--muted);font-size:.95rem;margin-top:.3rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="g-flamme" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#D4321D"/><stop offset=".6" stop-color="#F08A12"/><stop offset="1" stop-color="#F7CB2E"/></linearGradient></defs>
  <symbol id="i-bygning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></symbol>
  <symbol id="i-kjoretoy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 16.5v-4.2L5.8 7h12.4l2.3 5.3v4.2"/><path d="M3.5 12.5h17"/><circle cx="7.5" cy="16.8" r="1.9"/><circle cx="16.5" cy="16.8" r="1.9"/></symbol>
  <symbol id="i-vegetasjon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.5V11"/><path d="M12 11.5c0-4 2.8-6.3 6.5-7 0 4-2.4 7-6.5 7Z"/><path d="M12 14.5c0-3.2-2.4-5.3-5.8-5.8 0 3.3 2.2 5.8 5.8 5.8Z"/><path d="M4 20.5h16"/></symbol>
  <symbol id="i-pipe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12.5 12 5l9 7.5"/><path d="M5.5 11v9h13v-9"/><path d="M15.5 8V4.5H18v5.6"/></symbol>
  <symbol id="i-alarm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15Z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-industri" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20.5V11l5 3v-3l5 3V5.5h3v15"/><path d="M16 9.5h5v11"/><path d="M2.5 20.5h19"/></symbol>
  <symbol id="i-baat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15h18l-2.6 4.5H5.6Z"/><path d="M12 4v11"/><path d="M12 5.5l5.5 7.5H12"/></symbol>
  <symbol id="i-anna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21c-3.9 0-6.5-2.6-6.5-6 0-3.5 2.5-5.5 3.6-8.5 1.4 1.4 2 2.9 2 4.4 1-1 1.8-2.6 2-4.4 3 2.2 5.4 5.5 5.4 8.5 0 3.4-2.6 6-6.5 6Z"/></symbol>
</svg>

<div class="skjerm">
  <header class="topp">
    <svg class="logo" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="#1A1F26"/><path d="M17 28c-4.6 0-7.6-3-7.6-7 0-4.1 3-6.4 4.2-9.9 1.6 1.6 2.3 3.4 2.3 5.1 1.2-1.2 2.1-3 2.3-5.1 3.5 2.6 6.4 6.4 6.4 9.9 0 4-3 7-7.6 7Z" fill="url(#g-flamme)"/><path d="M17 28c-2 0-3.3-1.3-3.3-3.1 0-1.8 1.4-2.9 2-4.4 1.6 1.2 4.6 2.6 4.6 4.4 0 1.8-1.3 3.1-3.3 3.1Z" fill="#FFE9A6" opacity=".9"/></svg>
    <div class="namn">Brannlogg<small>STORD KOMMUNE · FRÅ POLITILOGGEN</small></div>
    <div class="batt" aria-hidden="true"></div>
    <div class="klokke"><b id="kl">--:--</b><span id="dato"></span></div>
  </header>

  <main class="hovud">
    <section class="panel teljar" id="teljar"></section>
    <section class="panel">
      <div class="etikett">Siste hendingar</div>
      <ul class="liste" id="liste"></ul>
    </section>
    <section class="panel">
      <div class="etikett">Kart · <b>siste 12 månader</b></div>
      <div class="kart" id="kart"></div>
      <div class="forklaring"><span class="s3"><i></i>Alvorleg</span><span class="s2"><i></i>Middels</span><span class="s1"><i></i>Mindre</span><span id="blink-tekst">Blinkar: siste 100 dagar</span></div>
    </section>
  </main>

  <footer class="botn">
    <div class="n110"><b>110</b><span>Ved brann:<br>ring brannvesenet</span></div>
    <div class="tips" id="tips"></div>
    <div class="qr"><img src="qr.svg" alt=""><span>Skann for å få Brannlogg på mobilen<small id="oppd"></small></span></div>
  </footer>
</div>

<script>
const DATA = /*__DATA__*/null;
(function(){
"use strict";
const D = DATA || {brannar:[], oppdatert:new Date().toISOString(), vindauge:50, kart:null};
const VINDU = D.vindauge || 50;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MND = ["januar","februar","mars","april","mai","juni","juli","august","september","oktober","november","desember"];
const MND_K = ["jan.","feb.","mars","apr.","mai","juni","juli","aug.","sep.","okt.","nov.","des."];
const DAG = ["sundag","måndag","tysdag","onsdag","torsdag","fredag","laurdag"];
const fp = new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Oslo",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric",second:"numeric",hourCycle:"h23"});
function oslo(v){
  const p = {}; fp.formatToParts(v instanceof Date ? v : new Date(v)).forEach(x => p[x.type] = x.value);
  const y = +p.year, m = +p.month, d = +p.day;
  return {y, m, d, h:+p.hour % 24, min:+p.minute, s:+p.second, dn:Date.UTC(y, m-1, d)/864e5, wd:new Date(Date.UTC(y, m-1, d)).getUTCDay()};
}
const pad = n => String(n).padStart(2, "0");
const kl = o => `${pad(o.h)}:${pad(o.min)}`;
const IDAG = oslo(new Date());
function relDag(o){
  const diff = IDAG.dn - o.dn;
  if (diff === 0) return "I dag";
  if (diff === 1) return "I går";
  return `${o.d}. ${MND_K[o.m-1]}`;
}
const TYPE = {bygning:"i-bygning", kjoretoy:"i-kjoretoy", vegetasjon:"i-vegetasjon", pipe:"i-pipe", alarm:"i-alarm", industri:"i-industri", baat:"i-baat", anna:"i-anna"};
const B = D.brannar.map(b => ({...b, _o:oslo(b.start)}));
const START = IDAG.dn - (VINDU - 1);

/* Klokke */
function klokke(){
  const o = oslo(new Date());
  $("#kl").textContent = kl(o);
  const dag = DAG[o.wd]; $("#dato").textContent = `${dag[0].toUpperCase() + dag.slice(1)} ${o.d}. ${MND[o.m-1]} ${o.y}`;
  if (o.dn !== IDAG.dn) location.reload();
}
klokke(); setInterval(klokke, 1000);

/* Teljar */
const aktive = B.filter(b => b.aktiv);
const siste = B[0];
let t = "";
if (aktive.length) {
  const a = aktive[0];
  t += `<div class="etikett">Akkurat no</div><div class="alarm"><h2>Pågår no</h2><p><b>${esc(a.tittel)}</b><br>${esc(a.stad)} · starta kl. ${kl(a._o)}</p></div>`;
} else if (siste) {
  const dagar = IDAG.dn - siste._o.dn;
  t += `<div class="etikett">Dagar sidan siste brann</div><div class="stort">${dagar}</div><div class="stort-tekst">${dagar === 1 ? "dag" : "dagar"}</div>
        <p class="siste">Siste: <b>${esc(siste.tittel)}</b><br>${esc(siste.stad)} · ${siste._o.d}. ${MND[siste._o.m-1]}</p>`;
}
const perDag = {};
B.filter(b => b._o.dn >= START).forEach(b => { perDag[b._o.dn] = Math.max(perDag[b._o.dn] || 0, b.alvor); });
let celler = "";
for (let i = 0; i < VINDU; i++) { const dn = START + i; celler += `<i class="${perDag[dn] ? "f" + perDag[dn] : ""}${dn === IDAG.dn ? " idag" : ""}"></i>`; }
const s0 = new Date(START * 864e5);
const n50 = B.filter(b => b._o.dn >= START).length;
const aar = B.filter(b => IDAG.dn - b._o.dn < 365).length;
t += `<div class="stripe-boks"><div class="etikett">Siste ${VINDU} dagar</div><div class="stripe" style="--kol:${VINDU}">${celler}</div>
      <div class="akse"><span>${s0.getUTCDate()}. ${MND_K[s0.getUTCMonth()]}</span><span>i dag</span></div>
      <div class="tal"><div><b>${n50}</b><span>siste ${VINDU} dagar</span></div><div><b>${aar}</b><span>siste 12 mnd</span></div><div><b>${(aar / 12).toLocaleString("nb-NO", {maximumFractionDigits:1})}</b><span>snitt per månad</span></div></div></div>`;
$("#teljar").innerHTML = t;
$("#blink-tekst").textContent = `Blinkar: siste ${VINDU} dagar`;

/* Liste – dei siste hendingane */
const rader = B.slice(0, 6).map(b => `<li class="rad s${b.alvor}${IDAG.dn - b._o.dn < 2 ? " ny" : ""}">
    <span class="strek"></span>
    <span class="ic"><svg aria-hidden="true"><use href="#${TYPE[b.type] || "i-anna"}"/></svg></span>
    <div><h3>${esc(b.tittel)}</h3><p><b>${esc(b.stad)}</b> · ${b.aktiv ? `<span class="pagar"><i></i>Pågår</span>` : "Avslutta"}</p></div>
    <div class="kor"><b>${relDag(b._o)}</b>kl. ${kl(b._o)}</div></li>`).join("");
$("#liste").innerHTML = rader || `<li class="tomt">Ingen brannar registrerte.</li>`;

/* Kart */
const K = D.kart;
if (K) {
  const P = K.proj;
  const xy = p => [(p[1] - P.lon0) * P.cos * P.k, (P.lat1 - p[0]) * P.k];
  const col = {1:"var(--sev1)", 2:"var(--sev2)", 3:"var(--sev3)"};
  const mk = B.filter(b => b.pos && IDAG.dn - b._o.dn < 365).map(b => ({b, p:xy(b.pos)}))
    .filter(({p}) => p[0] > 0 && p[0] < K.w && p[1] > 0 && p[1] < K.h)
    .sort((a, c) => a.b._o.dn - c.b._o.dn)
    .map(({b, p}) => {
      const ny = b._o.dn >= START, x = p[0].toFixed(1), y = p[1].toFixed(1);
      return `<g class="mk${ny ? "" : " gl"}">${ny ? `<circle class="ring" cx="${x}" cy="${y}" r="26" stroke="${col[b.alvor]}"/>` : ""}<circle class="c" cx="${x}" cy="${y}" r="${ny ? 26 : 18}" fill="${col[b.alvor]}"/></g>`;
    }).join("");
  const lbl = K.stader.map(s => `<circle class="m-dot" cx="${s.x}" cy="${s.y}" r="7"/><text class="m-lbl" x="${s.x + 14}" y="${s.y + 11}">${esc(s.namn)}</text>`).join("");
  $("#kart").innerHTML = `<svg viewBox="0 0 ${K.w} ${K.h}" preserveAspectRatio="xMidYMid meet"><path class="m-ctx" d="${K.kontekst}" fill-rule="evenodd"/><path class="m-land" d="${K.land}" fill-rule="evenodd"/>${lbl}${mk}</svg>`;
}

/* Botn */
const TIPS = [
  "Kulde gir meir fyring. Hald avstand mellom omnen og alt som kan brenne, og set oska ut i ei metallbøtte med lok.",
  "Sjekk at komfyrvakta verkar. Komfyren er ei av dei vanlegaste årsakene til brann i bustader.",
  "Tørt vårgras tek lett fyr. Snakk med brannvesenet før du brenn bråte eller gras.",
  "Frå 15. april til 15. september er det forbode å gjere opp eld i eller nær skog og anna utmark utan løyve.",
  "Set grillen på trygg avstand frå huset og tørr vegetasjon, og la eingongsgrillen kjølast heilt før du kastar han.",
  "Før sankthans: sjekk kommunen sine reglar og skogbrannfaren før du tenner bål.",
  "Lad elsykkel og elsparkesykkel på ein brannsikker stad, og ikkje medan alle søv.",
  "Tørt vêr: kast aldri sigarettar eller eingongsgrillar i terrenget.",
  "Før fyringssesongen: få pipa og eldstaden sjekka, og fjern sot og skrot rundt omnen.",
  "Test røykvarslarane no. Byt batteri om det er eldre enn eitt år.",
  "Ha brannslokkingsapparat eller brannslange lett tilgjengeleg, og sjekk at alle i huset veit kvar det er.",
  "Aldri gå frå levande lys, og set dei på eit underlag som ikkje brenn. 1. desember er røykvarslardagen."
];
